name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Question bank is up to date with the content
        run: |
          pnpm bank:build
          git diff --exit-code -I '"compiledAt"' content/bank/bank.json || (echo "Run pnpm bank:build and commit content/bank/" && exit 1)
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @setu/pwa build

  speech:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/speech } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -e ".[dev]"
      - run: pytest -q
